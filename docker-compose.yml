version: "3.9"

networks:
  pipeline-net:
    external: true

services:

  intent-scoring-worker:
    build:
      context: .
      dockerfile: Dockerfile.intent-scoring-worker
    container_name: intent-scoring-worker
    env_file:
      - .env
    restart: always
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  intent-sqs-worker:
    build:
      context: .
      dockerfile: Dockerfile.intent-scoring-worker
    container_name: intent-sqs-worker
    command: ["python", "workers/intent_sqs_worker.py"]
    env_file:
      - .env
    environment:
      AWS_REGION: ap-south-1
    restart: always
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
