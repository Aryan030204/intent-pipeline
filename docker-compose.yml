version: "3.9"

networks:
  pipeline-net:
    external: true

services:
  intent-data-aggregation:
    build: .
    container_name: intent-data-aggregation
    env_file:
      - .env
    restart: always
    # Resource isolation for the shared 4 GiB host: no swap spill (memswap_limit == mem_limit),
    # a CPU ceiling and a PID cap.
    mem_limit: ${INTENT_AGGREGATION_MEM_LIMIT:-768m}
    memswap_limit: ${INTENT_AGGREGATION_MEM_LIMIT:-768m}
    cpus: ${INTENT_AGGREGATION_CPUS:-1.0}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  intent-scoring-worker:
    build:
      context: .
      dockerfile: Dockerfile.intent-scoring-worker
    container_name: intent-scoring-worker
    env_file:
      - .env
    environment:
      # Catch-up + scoring + calibration at startup wait this long (see workers/intent_scoring_worker.py).
      INTENT_SCORING_STARTUP_DELAY_S: ${INTENT_SCORING_STARTUP_DELAY_S:-210}
    restart: always
    mem_limit: ${INTENT_SCORING_WORKER_MEM_LIMIT:-768m}
    memswap_limit: ${INTENT_SCORING_WORKER_MEM_LIMIT:-768m}
    cpus: ${INTENT_SCORING_WORKER_CPUS:-1.0}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Kafka -> MySQL intent consumer. Reaches Kafka as kafka-service:9092 over pipeline-net
  # (the kafka-service stack lives in the dashboard repo's compose file, so depends_on cannot
  # reference it; the worker exits if the topics are missing and restart: always retries).
  intent-kafka-worker:
    build:
      context: .
      dockerfile: Dockerfile.intent-scoring-worker
    container_name: intent-kafka-worker
    command: ["python", "workers/intent_kafka_worker.py"]
    env_file:
      - .env
    restart: always
    # SIGTERM lets the current batch finish (MySQL COMMIT, then offset commit) before exit.
    stop_grace_period: 60s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
